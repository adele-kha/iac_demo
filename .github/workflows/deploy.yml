name: Validate JSON on PR

on:
  pull_request:
    paths:
      - '*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all JSON files are valid
        run: for f in *.json; do echo "Checking $f" && python3 -m json.tool "$f" > /dev/null; done

      - name: Check prompt mentions source and target languages
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("prompts.json") as f:
              data = json.load(f)
          errors = []
          for prompt in data.get("prompts", []):
              pid    = prompt.get("id", "unknown")
              src    = prompt.get("source_language", "")
              tgt    = prompt.get("target_language", "")
              system = prompt.get("system", "")
              if src and src not in system:
                  errors.append(f"❌ '{pid}': source language '{src}' not mentioned in prompt")
              if tgt and tgt not in system:
                  errors.append(f"❌ '{pid}': target language '{tgt}' not mentioned in prompt")
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print("✅ All prompts mention their source and target languages.")
          EOF