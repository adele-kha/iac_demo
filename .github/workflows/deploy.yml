name: Validate JSON on PR

on:
  pull_request:
    paths:
      - 'data.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data.json is valid JSON
        run: python -m json.tool data.json

      - name: Check no language has 0 native speakers
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("data.json") as f:
              data = json.load(f)
          errors = [
              lang["name"]
              for lang in data.get("languages", [])
              if lang.get("native_speakers_M", 0) == 0
          ]
          if errors:
              print(f"❌ These languages have 0 native speakers: {errors}")
              sys.exit(1)
          print("✅ All languages have valid speaker counts.")
          EOF